# mautrix-whatsapp (bridgev2, v26.x series) configuration template
# Documentation: https://docs.mau.fi/bridges/go/whatsapp/
# Rendered once by community-stack; afterwards the bridge's own config.yaml is authoritative.

network:
  displayname_template: "{{or .FullName .PushName}} (WA)"

homeserver:
  address: http://matrix-synapse:8008
  domain: ${MATRIX_DOMAIN}
  software: standard

appservice:
  address: http://whatsapp-bridge:29318
  hostname: 0.0.0.0
  port: 29318
  id: whatsapp
  bot:
    username: whatsappbot
    displayname: WhatsApp Bridge Bot
  as_token: ${WHATSAPP_AS_TOKEN}
  hs_token: ${WHATSAPP_HS_TOKEN}
  username_template: whatsapp_{{.}}

database:
  type: sqlite3-fk-wal
  uri: file:/data/mautrix-whatsapp.db?_txlock=immediate

bridge:
  personal_filtering_spaces: false
  permissions:
    "*": "relay"
    "${MATRIX_DOMAIN}": "user"
    "@community-stack-admin:${MATRIX_DOMAIN}": "admin"

encryption:
  allow: true
  default: false
  require: false

provisioning:
  # Only the bridge's own management endpoints use this; the Community Stack
  # admin console talks to the bot through Matrix, not this API.
  allow_matrix_auth: false
