# mautrix-whatsapp (bridgev2, v26.x series) configuration template
# Documentation: https://docs.mau.fi/bridges/go/whatsapp/
# Rendered once by community-stack; afterwards the bridge's own config.yaml is authoritative.

network:
  displayname_template: "{{or .FullName .PushName}} (WA)"
  # Larger groups sync non-admin members only as they participate.
  max_member_sync: 200
  history_sync:
    max_initial_conversations: 0
    request_full_sync: false

homeserver:
  address: http://matrix-synapse:8008
  domain: ${MATRIX_DOMAIN}
  software: standard

appservice:
  address: http://whatsapp-bridge:29318
  hostname: 0.0.0.0
  port: 29318
  id: whatsapp
  bot:
    username: whatsappbot
    displayname: WhatsApp Bridge Bot
  as_token: ${AS_TOKEN}
  hs_token: ${HS_TOKEN}
  username_template: whatsapp_{{.}}

database:
  type: sqlite3-fk-wal
  uri: file:/data/mautrix-whatsapp.db?_txlock=immediate

bridge:
  personal_filtering_spaces: false
  # Do not create a room and Matrix accounts for every contact or chat on the linked phone.
  # Only chats listed under portal_create_filter are bridged automatically.
  portal_create_filter:
    mode: allow
    list: []
  # Shared relay: the admin login relays messages from Matrix users who are not logged in.
  relay:
    enabled: true
    admin_only: true
  permissions:
    "*": "relay"
    "${MATRIX_DOMAIN}": "user"
    "@community-stack-admin:${MATRIX_DOMAIN}": "admin"

encryption:
  allow: true
  default: false
  require: false

provisioning:
  # Only the bridge's own management endpoints use this; the Community Stack
  # admin console talks to the bot through Matrix, not this API.
  allow_matrix_auth: false
