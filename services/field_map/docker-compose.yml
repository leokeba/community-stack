services:
  field_map-db:
    image: postgis/postgis:${FIELD_MAP_DATABASE_VERSION:-16-3.4}
    container_name: community_field_map_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldmap
      POSTGRES_USER: fieldmap
      POSTGRES_PASSWORD: ${FIELD_MAP_DB_PASSWORD:?Set FIELD_MAP_DB_PASSWORD in .env}
    volumes:
      - ../../${FIELD_MAP_DATABASE_DATA_PATH:-data/field_map/postgres}:/var/lib/postgresql/data
    networks:
      - field_map_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldmap -d fieldmap"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${FIELD_MAP_DATABASE_MEMORY_LIMIT:-512M}
    cpus: ${FIELD_MAP_DATABASE_CPU_LIMIT:-1}

  field_map:
    image: community-stack/field-map:${FIELD_MAP_VERSION:?Set FIELD_MAP_VERSION in .env}
    build:
      context: https://github.com/leokeba/field-map.git#${FIELD_MAP_SOURCE_REF:?Set FIELD_MAP_SOURCE_REF in .env}
      dockerfile: deploy/community-stack/Dockerfile
      args:
        VITE_TILE_URL: ${FIELD_MAP_TILE_URL:-}
    container_name: community_field_map
    restart: unless-stopped
    user: ${FIELD_MAP_UID:-1000}:${FIELD_MAP_GID:-1000}
    environment:
      APP_ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://fieldmap:${FIELD_MAP_DB_PASSWORD:?Set FIELD_MAP_DB_PASSWORD in .env}@field_map-db:5432/fieldmap
      UPLOAD_DIR: /data/uploads
      ANONYMOUS_LINKS_ENABLED: ${FIELD_MAP_ANONYMOUS_LINKS_ENABLED:-true}
      CORS_ORIGINS: ${FIELD_MAP_ORIGIN:?Set FIELD_MAP_ORIGIN in .env}
      MAX_UPLOAD_SIZE_BYTES: ${FIELD_MAP_MAX_UPLOAD_SIZE_BYTES:-10000000}
    volumes:
      - ../../${FIELD_MAP_UPLOADS_PATH:-data/field_map/uploads}:/data/uploads
    depends_on:
      field_map-db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - proxy_net
      - field_map_internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${FIELD_MAP_MEMORY_LIMIT:-512M}
    cpus: ${FIELD_MAP_CPU_LIMIT:-1}

networks:
  proxy_net:
    external: true
  field_map_internal:
    internal: true
