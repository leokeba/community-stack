services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: community_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Read by the Caddyfile's {$WEB_DOMAIN}, {$MATRIX_DOMAIN} and {$ACME_EMAIL}.
      WEB_DOMAIN: ${WEB_DOMAIN:-community.example.org}
      MATRIX_DOMAIN: ${MATRIX_DOMAIN:-matrix.example.org}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../data/caddy/data:/data
      - ../../data/caddy/config:/config
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/metrics || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy_net:
    external: true
