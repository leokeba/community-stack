services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: community_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../data/caddy/data:/data
      - ../../data/caddy/config:/config
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/metrics || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy_net:
    external: true
