services:
  safemode:
    image: community-stack-safemode:0.1.0
    pull_policy: build
    build:
      context: ../..
      dockerfile: services/safemode/Dockerfile
    container_name: community_safemode
    restart: unless-stopped
    user: "${COMMUNITY_STACK_UID:-1000}:${COMMUNITY_STACK_GID:-1000}"
    # Holds the appservice tokens and the Safe Mode database. Nothing else is mounted.
    volumes:
      - ../../data/safemode:/data
    networks:
      bridge_net:
        aliases:
          - community-safemode
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8090/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  bridge_net:
    external: true
