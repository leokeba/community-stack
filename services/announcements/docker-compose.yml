services:
  announcements:
    image: community-stack-announcements:0.1.0
    pull_policy: build
    build:
      context: ../..
      dockerfile: services/announcements/Dockerfile
    container_name: community_announcements
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      COMMUNITY_STACK_ADMIN_SETUP_TOKEN: ${COMMUNITY_STACK_ADMIN_SETUP_TOKEN:-}
      COMMUNITY_STACK_ANNOUNCEMENTS_DB_PATH: /app/data/announcements/announcements.db
      COMMUNITY_STACK_FEED_DIR: /app/data/landing/feed
      COMMUNITY_STACK_CONFIG: /app/community-stack.yaml
    volumes:
      - ../../data/announcements:/app/data/announcements
      - ../../data/landing/feed:/app/data/landing/feed
      - ../../community-stack.yaml:/app/community-stack.yaml:ro
    networks:
      - proxy_net
      - announcements_internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy_net:
    external: true
  announcements_internal:
    internal: true
