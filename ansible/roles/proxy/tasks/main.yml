---
- name: Ensure proxy data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ project_root | default('/opt/community-stack') }}/data/caddy/data"
    - "{{ project_root | default('/opt/community-stack') }}/data/caddy/config"

- name: Create proxy_net external Docker network if not exists
  community.docker.docker_network:
    name: proxy_net
    driver: bridge
    state: present

- name: Deploy Caddy Ingress Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ project_root | default('/opt/community-stack') }}/services/proxy"
    state: present
