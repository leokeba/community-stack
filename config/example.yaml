# Community Communications Stack Configuration Example
# Validated against config/schema.json

project:
  name: "community"
  profile: "starter" # starter | community | accessible | resilient
  timezone: "UTC" # IANA name used for scheduling, e.g. Europe/Paris

domain:
  base: "example.org"
  matrix: "matrix.example.org"
  web: "community.example.org"

services:
  matrix:
    enabled: true
    federation: false
    allow_registration: false
    database_type: "postgres"
    max_upload_size_mb: 50
  element:
    enabled: true
  announcements:
    enabled: true
    channels:
      web_feed:
        enabled: true
      matrix_room:
        enabled: false
  signal:
    enabled: false # experimental; see docs/operations.md
  whatsapp_bridge:
    enabled: false
    mode: "none" # none | announcements_only | selective_bridge
    mapped_rooms: []
  vikunja:
    enabled: false
    version: "2.7.1"
    # hostname: "tasks.example.org" # defaults to tasks.<domain.base>
    files_path: "data/vikunja/files"
    database:
      type: "postgres"
      data_path: "data/vikunja/postgres"
    allow_registration: false
    enable_link_sharing: false
    memory_limit: "512M"
    cpu_limit: 1
  facilmap:
    enabled: false
    # Immutable digest for upstream's 2026-10-30 main build (Node 22, amd64/arm64).
    version: "sha256:bcef0c14e23f8670ea21d18a15d4331348bf253550a5acf39b19d067546f629f"
    # hostname: "maps.example.org" # defaults to maps.<domain.base>
    cache_path: "data/facilmap/cache"
    database:
      version: "11.4.12"
      data_path: "data/facilmap/mariadb"
      memory_limit: "512M"
      cpu_limit: 1
    memory_limit: "512M"
    cpu_limit: 1
  librebooking:
    enabled: false
    version: "7.2.0-3.5.2"
    # hostname: "booking.example.org" # defaults to booking.<domain.base>
    admin_email: "admin@example.org"
    allow_registration: false
    database:
      version: "11.4.12"
      data_path: "data/librebooking/mariadb"
      memory_limit: "512M"
      cpu_limit: 1
    config_path: "data/librebooking/config"
    uploads_path: "data/librebooking/uploads"
    logs_path: "data/librebooking/logs"
    memory_limit: "512M"
    cpu_limit: 1
  field_map:
    enabled: false
    version: "107595ae25d0ea197efb6ee8fddc29047bc6c623"
    # hostname: "field-map.example.org" # defaults to field-map.<domain.base>
    tile_url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
    anonymous_links_enabled: true
    uploads_path: "data/field_map/uploads"
    database:
      version: "16-3.4"
      data_path: "data/field_map/postgres"
      memory_limit: "512M"
      cpu_limit: 1
    memory_limit: "512M"
    cpu_limit: 1

operations:
  backups:
    enabled: true
    schedule: "daily" # hourly | daily | weekly
    target: "local" # local | s3 | sftp
    encryption: "restic" # restic (client-side encrypted) | none (owner-only archives)
    retention_days: 14
    storage_path: "./backups"
  monitoring:
    enabled: true
