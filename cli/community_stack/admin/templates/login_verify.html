{% extends "base.html" %}
{% block title %}Two-step login{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Enter your login code</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login/verify">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="code">6-digit code from your authenticator app, or a recovery code</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="20" required autofocus>
    <button type="submit">Log in</button>
  </form>
</div>
<p class="auth-note">Lost your phone and your recovery codes? Ask another owner or admin to turn off two-step login for your account.</p>
{% endblock %}
