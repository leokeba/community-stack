{% if card.enabled and card.url %}
<div class="notice" role="status">
  <p><a href="{{ card.url }}" target="_blank" rel="noopener noreferrer">Open space reservations</a>.</p>
  <form method="post" action="/admin/librebooking/setup">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="librebooking-setup-password">Confirm with your password to view installation credentials</label>
    <input id="librebooking-setup-password" name="password" type="password" autocomplete="current-password" required>
    <p><button type="submit" class="secondary">Show first-setup instructions</button></p>
  </form>
</div>
{% endif %}
